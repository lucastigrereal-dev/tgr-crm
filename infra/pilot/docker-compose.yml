name: tgr-crm-pilot

x-app-image: &app-image
  image: tgr-crm-pilot:local
  build:
    context: ../..
    dockerfile: infra/pilot/Dockerfile
    args:
      GIT_SHA: "${GIT_SHA:-unknown}"

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: tgr_crm_pilot
      MYSQL_USER: tgr_app
      MYSQL_PASSWORD: "${MYSQL_APP_PASSWORD}"
    ports:
      - "127.0.0.1:44326:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: ["--skip-log-bin"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -uroot --host=127.0.0.1 --silent"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

  migrate:
    <<: *app-image
    profiles: ["admin"]
    environment:
      DATABASE_URL: "mysql://tgr_app:${MYSQL_APP_PASSWORD}@mysql:3306/tgr_crm_pilot"
    command: ["sh", "-lc", "corepack pnpm exec drizzle-kit migrate"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app-image
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql://tgr_app:${MYSQL_APP_PASSWORD}@mysql:3306/tgr_crm_pilot"
      JWT_SECRET: "${JWT_SECRET}"
      VITE_APP_ID: "tgr-crm-pilot"
      LOCAL_AUTH_ENABLED: "1"
      LOCAL_AUTH_USERNAME: "${LOCAL_AUTH_USERNAME}"
      LOCAL_AUTH_PASSWORD_HASH: "${LOCAL_AUTH_PASSWORD_HASH}"
      LOCAL_AUTH_USERS: "${LOCAL_AUTH_USERS:-}"
      LOCAL_AUTH_DISPLAY_NAME: "${LOCAL_AUTH_DISPLAY_NAME}"
      LOCAL_STORAGE_DIRECTORY: "/data/documents"
      SALES_COMMAND_INTEGRATION_KEY: "${SALES_COMMAND_INTEGRATION_KEY:-}"
      ENCOUNTER_TIMES_RECEIVER_ENABLED: "${ENCOUNTER_TIMES_RECEIVER_ENABLED:-false}"
      ATTENDANCE_RECEIVER_ENABLED: "${ATTENDANCE_RECEIVER_ENABLED:-false}"
      RECOVERY_INTEGRATION_KEY: "${RECOVERY_INTEGRATION_KEY:-}"
      OFFICIAL_INDICATOR_CATALOG_ENABLED: "${OFFICIAL_INDICATOR_CATALOG_ENABLED:-false}"
      COMMISSION_ROLE_MAP_ENABLED: "${COMMISSION_ROLE_MAP_ENABLED:-false}"
      FEATURE_FLAG_OVERRIDES_ENABLED: "${FEATURE_FLAG_OVERRIDES_ENABLED:-false}"
      RECOVERY_ELIGIBILITY_ENABLED: "${RECOVERY_ELIGIBILITY_ENABLED:-false}"
      COMMISSION_V2_RELEASED: "${COMMISSION_V2_RELEASED:-false}"
      SALE_VALIDATED_QUOTAS_COUNT_ENABLED: "${SALE_VALIDATED_QUOTAS_COUNT_ENABLED:-false}"
      FINANCIAL_PROJECT_MAP_ENABLED: "${FINANCIAL_PROJECT_MAP_ENABLED:-false}"
      CONTRACT_ADDENDUM_ENABLED: "${CONTRACT_ADDENDUM_ENABLED:-false}"
      SALE_ORDER_GATE_ENABLED: "${SALE_ORDER_GATE_ENABLED:-false}"
      QUALIFICATION_POLICY_VERSIONING_ENABLED: "${QUALIFICATION_POLICY_VERSIONING_ENABLED:-false}"
      COMMISSION_CANCEL_POLICY_ENABLED: "${COMMISSION_CANCEL_POLICY_ENABLED:-false}"
      COMMISSION_POLICY_VERSIONING_ENABLED: "${COMMISSION_POLICY_VERSIONING_ENABLED:-false}"
      INSTALLMENT_EVIDENCE_IN_EVENT: "${INSTALLMENT_EVIDENCE_IN_EVENT:-false}"
      INVENTORY_HOLD_AT_FORMALIZATION: "${INVENTORY_HOLD_AT_FORMALIZATION:-false}"
      SALE_ORDER_GATE_SINCE: "${SALE_ORDER_GATE_SINCE:-}"
      CSRF_ORIGIN_CHECK_ENABLED: "${CSRF_ORIGIN_CHECK_ENABLED:-false}"
      CSRF_ALLOWED_ORIGINS: "${CSRF_ALLOWED_ORIGINS:-}"
      NQ_READ_ENDPOINT_ENABLED: "${NQ_READ_ENDPOINT_ENABLED:-false}"
      ORPHAN_BLOB_SWEEP_ENABLED: "${ORPHAN_BLOB_SWEEP_ENABLED:-false}"
      ORPHAN_BLOB_SWEEP_DELETE: "${ORPHAN_BLOB_SWEEP_DELETE:-false}"
      RELATIONSHIP_ENDPOINT: "${RELATIONSHIP_ENDPOINT:-}"
      RELATIONSHIP_CRM_INTEGRATION_KEY: "${RELATIONSHIP_CRM_INTEGRATION_KEY:-}"
      FINANCIAL_ENDPOINT: "${FINANCIAL_ENDPOINT:-}"
      FINANCIAL_CRM_INTEGRATION_KEY: "${FINANCIAL_CRM_INTEGRATION_KEY:-}"
      FINANCIAL_PROJECT_EXTERNAL_KEY: "${FINANCIAL_PROJECT_EXTERNAL_KEY:-}"
      FINANCIAL_PROJECT_NAME: "${FINANCIAL_PROJECT_NAME:-}"
      FINANCIAL_PROJECT_TIMEZONE: "${FINANCIAL_PROJECT_TIMEZONE:-America/Recife}"
      PORT: "3000"
    ports:
      - "127.0.0.1:44100:3000"
    volumes:
      - documents_data:/data/documents
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://app:3000"]
    depends_on:
      app:
        condition: service_healthy

volumes:
  mysql_data:
  documents_data:
