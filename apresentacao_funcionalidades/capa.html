<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <style>
    * { margin: 0; box-sizing: border-box; }
    .slide-container { width: 1280px; min-height: 720px; background: #E3E8EC; color: #0F172A; display: flex; flex-direction: column; }
    .topline { height: 12px; background: #059669; }
    .content { display: grid; grid-template-columns: 180px 1fr; gap: 44px; padding: 82px 92px 72px; flex: 1; }
    .seal { width: 112px; height: 112px; border: 1px solid #059669; border-radius: 56px; display: flex; align-items: center; justify-content: center; color: #059669; font-family: Georgia, serif; font-size: 28px; margin-top: 18px; }
    .eyebrow { color: #059669; font: 700 15px/1 Arial, sans-serif; letter-spacing: 3.8px; text-transform: uppercase; padding-bottom: 26px; border-bottom: 1px dotted #64748B; }
    h1 { font: 700 64px/0.98 Impact, Arial Narrow, sans-serif; letter-spacing: -1px; text-transform: uppercase; max-width: 820px; margin-top: 42px; }
    .sub { font: 300 29px/1.32 Georgia, serif; color: #334155; max-width: 770px; margin-top: 27px; }
    .note { font: 700 14px/1 Arial, sans-serif; letter-spacing: 1.8px; color: #334155; text-transform: uppercase; margin-top: 54px; }
    .footer { display: flex; justify-content: space-between; padding: 0 92px 42px; font: 700 13px/1 Arial, sans-serif; color: #475569; letter-spacing: 1.3px; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="topline"></div>
    <div class="content">
      <div class="seal">TSE</div>
      <div>
        <div class="eyebrow">Apresentação executiva · Sistema proprietário</div>
        <h1>TSE CRM<br>Exclusivo</h1>
        <div class="sub">Operação de timeshare e multipropriedade, da venda à reserva, da cobrança à inteligência operacional.</div>
        <div class="note">Nome provisório de trabalho · marca final a definir</div>
      </div>
    </div>
    <div class="footer"><span>Lucas Tigre · Tigre Digital Group</span><span>20 ago 2026</span></div>
  </div>
</body>
</html>
