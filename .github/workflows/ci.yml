name: TGR CRM CI

# CI diet (2026-10-09): sem push em branches, sem PR em draft, sem rodar por mudanca so de docs.
# T-01 (2026-10-16): push na main roda a mesma CI, para existir prova no SHA da main (OPS-12); uma rodada por SHA da main (grupo por SHA, sem cancelar).
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
  pull_request:
    # Sem paths-ignore em PR: com ele um PR so de docs nunca criava os checks obrigatorios e ficava preso. O job `changes` detecta PR so de docs
    # e os jobs pesados (mesmos nomes dos checks obrigatorios) sao PULADOS por condicao; job pulado conta como sucesso na protecao de branch.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tgr-crm-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detecta PR so de docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - name: PR so de docs (**.md, docs/**, .claude/**)?
        id: docs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          docs_only=false
          if [ "$EVENT" = "pull_request" ]; then
            files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | .filename, (.previous_filename // empty)')"
            # Fail-safe: lista vazia ou qualquer arquivo fora de docs => roda tudo; se o `gh api` falhar o step falha (set -e do shell) e os jobs pesados rodam (result != success).
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -vE '(\.md$|^docs/|^\.claude/)' | grep -q .; then docs_only=true; fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"

  quality:
    name: Typecheck, tests, build e bundle budget
    needs: changes
    # Fail-safe: so PULA quando o detector rodou COM SUCESSO e disse docs_only. Detector falhou/pulado => roda tudo (!cancelled() deixa o job rodar mesmo com `needs` falho, mas run cancelado pelo concurrency nao sobe job pesado; previous_filename cobre renames para fora de docs).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') && (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate configuration shape
        run: pnpm config:doctor
        env:
          JWT_SECRET: ci-only-secret-with-at-least-32-characters

      - name: Typecheck
        run: pnpm check

      - name: Unit and integration tests
        run: pnpm test -- --reporter=dot --pool=forks --poolOptions.forks.singleFork=true

      - name: Production build
        run: pnpm build

      - name: Bundle budget
        run: node scripts/check-bundle-budget.mjs

      - name: Validate pilot Docker Compose
        run: docker compose -f infra/pilot/docker-compose.yml config --quiet
        env:
          MYSQL_ROOT_PASSWORD: ci-root-placeholder
          MYSQL_APP_PASSWORD: ci-app-placeholder
          JWT_SECRET: ci-runtime-secret-with-at-least-32-characters
          LOCAL_AUTH_USERNAME: ci.admin
          LOCAL_AUTH_PASSWORD_HASH: scrypt:ci-placeholder
          LOCAL_AUTH_DISPLAY_NAME: CI Admin

      - name: Build pilot Docker image
        run: docker build -f infra/pilot/Dockerfile -t tgr-crm-pilot:ci .

  mysql-integration:
    name: Testes *.mysql.test.ts em MySQL descartável
    needs: changes
    # Fail-safe: so PULA quando o detector rodou COM SUCESSO e disse docs_only. Detector falhou/pulado => roda tudo (!cancelled() deixa o job rodar mesmo com `needs` falho, mas run cancelado pelo concurrency nao sobe job pesado; previous_filename cobre renames para fora de docs).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') && (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: tgr-it-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptgr-it-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # Banco por run, sufixo _test (exigido por server/e2eSafety.ts). DATABASE_URL fica de fora: cada teste MySQL define a sua.
      TGR_MYSQL_INTEGRATION_URL: mysql://root:tgr-it-root@127.0.0.1:3306/tgr_crm_ci_${{ github.run_id }}_test
      JWT_SECRET: ci-only-it-secret-with-at-least-32-characters
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create the run-owned disposable database
        run: >-
          node --input-type=module -e "import mysql from 'mysql2/promise';
          const url = new URL(process.env.TGR_MYSQL_INTEGRATION_URL);
          const database = url.pathname.slice(1);
          if (!/^tgr_crm_[a-z0-9_]+_test$/.test(database)) throw new Error('Banco de integração inválido: ' + database);
          url.pathname = '/';
          const conn = await mysql.createConnection(url.toString());
          await conn.query('CREATE DATABASE \`' + database + '\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci');
          await conn.end();
          console.log(JSON.stringify({ event: 'integration.database.prepared', database }));"

      - name: Apply reviewed migrations
        run: pnpm exec drizzle-kit migrate
        env:
          DATABASE_URL: ${{ env.TGR_MYSQL_INTEGRATION_URL }}

      - name: MySQL integration tests (forks, arquivos em sequência: banco compartilhado e estado global)
        run: pnpm exec vitest run --reporter=dot --pool=forks --no-file-parallelism .mysql.test.ts

  e2e:
    name: E2E autenticado em MySQL descartável
    needs: changes
    # Fail-safe: so PULA quando o detector rodou COM SUCESSO e disse docs_only. Detector falhou/pulado => roda tudo (!cancelled() deixa o job rodar mesmo com `needs` falho, mas run cancelado pelo concurrency nao sobe job pesado; previous_filename cobre renames para fora de docs).
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') && (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: tgr-e2e-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptgr-e2e-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      E2E_RUN_ID: ci_${{ github.run_id }}
      E2E_DATABASE_URL: mysql://root:tgr-e2e-root@127.0.0.1:3306/tgr_crm_ci_${{ github.run_id }}_e2e
      DATABASE_URL: mysql://root:tgr-e2e-root@127.0.0.1:3306/tgr_crm_ci_${{ github.run_id }}_e2e
      E2E_CONFIRM_ISOLATED: I_CONFIRM_ISOLATED_E2E
      E2E_STRICT: "1"
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_RECEIPT_PATH: e2e/.runtime/receipt-ci_${{ github.run_id }}.json
      JWT_SECRET: ci-only-e2e-secret-with-at-least-32-characters
      VITE_APP_ID: tgr-e2e
      OAUTH_SERVER_URL: http://127.0.0.1:65535
      OWNER_OPEN_ID: E2E-TGR-ci_${{ github.run_id }}-OWNER
      SALES_COMMAND_INTEGRATION_KEY: e2e-sales-command-ci-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate strict E2E configuration
        run: pnpm config:doctor:e2e

      - name: Prove isolation before database creation
        run: node scripts/check-e2e-isolation.mjs
        env:
          DATABASE_URL: ""

      - name: Create the run-owned disposable database
        run: node scripts/prepare-e2e-database.mjs
        env:
          DATABASE_URL: ""

      - name: Apply reviewed migrations
        run: pnpm exec drizzle-kit migrate

      - name: Seed deterministic TGR fixtures
        run: node scripts/seed-e2e-isolated.mjs
        env:
          DATABASE_URL: ""

      - name: Export disposable contract id
        run: >-
          node --input-type=module -e "import { appendFileSync, readFileSync } from 'node:fs';
          const receipt = JSON.parse(readFileSync(process.env.E2E_RECEIPT_PATH, 'utf8'));
          const contractId = Number(receipt.contractId);
          if (!Number.isInteger(contractId) || contractId <= 0) throw new Error('Receipt sem contractId válido.');
          appendFileSync(process.env.GITHUB_ENV, 'E2E_CANCELLATION_CONTRACT_ID=' + contractId + '\n');"

      - name: Run strict authenticated browser journeys
        run: pnpm exec playwright test e2e/strict-isolated.spec.ts --reporter=line,html

      - name: Drop only this run-owned database
        if: always()
        run: node scripts/cleanup-e2e-isolated.mjs
        env:
          DATABASE_URL: ""

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tgr-e2e-${{ github.run_id }}
          path: |
            playwright-report
            test-results
            e2e/.runtime
          if-no-files-found: warn
